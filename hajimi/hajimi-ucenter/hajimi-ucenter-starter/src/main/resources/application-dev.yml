server:
  port: 28080

spring:
  datasource:
    url: jdbc:mysql://8.133.241.135:3306/kalami_db?characterEncoding=UTF-8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: Mysql_123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 0
      max-lifetime: 1500000
      pool-name: MyHikariCP
logging:
  level:
    com.apzda: debug
    com.apzda.kalami.security: debug
    web: debug

hajimi:
  ucenter:
    mfa-force-enabled: false
    security:
      auto-sync: false

kalami:
  security:
    excludes:
      - "/wk/uc/log*"
      - "/wk/uc/refresh-token"
      - "/mashup/captcha/**"
      - "/_/**"
    cors:
      "[/**]":
        origin-patterns:
          - "*"
        headers:
          - authorization
          - uuid
          - content-type
          - x-captcha-id
          - x-device
          - x-app
          - x-m-appid
          - x-m-provider
          - x-m-refresh
        credentials: true
    access-token-timeout: 30d
